        "operationId": "importInvestors",
        "responses": {
          "400": {
            "description": "Invalid CSV; row, field and rejected value are returned when identifiable",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CrmValidationError"}}}
          },
          "200": {
            "description": "Success",
