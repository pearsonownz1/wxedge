openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WX Edge — Kalshi weather market edge API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stations
    description: Settlement station operations
  - name: markets
    description: Kalshi market operations
  - name: rain
    description: Daily precipitation market operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /pipeline-health:
    get:
      operationId: getPipelineHealth
      tags: [health]
      summary: Trading pipeline watchdog status
      description: Detects the pipeline going dark (zero evaluated signals or zero proposals over the window) and distinguishes it from a legitimately quiet market via the suppressed_reason mix
      responses:
        "200":
          description: Pipeline health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineHealth"

  /stations:
    get:
      operationId: listStations
      tags: [stations]
      summary: List all settlement stations
      description: Returns all 6 Kalshi settlement stations sorted by best absolute edge
      responses:
        "200":
          description: List of stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StationSummary"

  /stations/{stationId}:
    get:
      operationId: getStation
      tags: [stations]
      summary: Get full station detail
      description: Returns calibration stats, settlement window, and intraday ASOS observations
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Station detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationDetail"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stations/{stationId}/distribution:
    get:
      operationId: getStationDistribution
      tags: [stations]
      summary: Get bracket probability distribution for a station
      description: Returns calibrated model vs Kalshi implied probabilities per bracket, with lock-in status
      parameters:
        - name: stationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bracket distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationDistribution"
        "404":
          description: Station not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List all active bracket markets ranked by net edge
      description: Returns all active bracket markets across all stations, ranked by fee-adjusted net edge
      responses:
        "200":
          description: Market list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketList"

  /markets/{contractId}:
    get:
      operationId: getMarket
      tags: [markets]
      summary: Get single contract detail
      description: Returns full contract detail with order book, WHY breakdown, and all-brackets comparison
      parameters:
        - name: contractId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDetail"
        "404":
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rain/markets:
    get:
      operationId: getRainMarkets
      tags: [rain]
      summary: List active daily rain markets
      description: Returns active KXRAIN contracts with public Kalshi quotes and NWS hourly precipitation probabilities
      responses:
        "200":
          description: Rain market list and feed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RainMarketsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PipelineHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, quiet, blocked, stalled, dark]
        windowHours:
          type: number
        evaluatedCount:
          type: number
        liveCount:
          type: number
        proposalCount:
          type: number
        dominantReason:
          type: [string, "null"]
        dominantShare:
          type: [number, "null"]
        reasonMix:
          type: object
          additionalProperties:
            type: number
        lastSignalTs:
          type: [string, "null"]
        lastLiveSignalTs:
          type: [string, "null"]
        lastProposalTs:
          type: [string, "null"]
        summary:
          type: string
      required:
        - status
        - windowHours
        - evaluatedCount
        - liveCount
        - proposalCount
        - dominantReason
        - dominantShare
        - reasonMix
        - lastSignalTs
        - lastLiveSignalTs
        - lastProposalTs
        - summary

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RainMarket:
      type: object
      properties:
        ticker:
          type: string
        cityCode:
          type: string
        cityName:
          type: string
        contractDate:
          type: string
        yesBidCents:
          type: ["integer", "null"]
        yesAskCents:
          type: ["integer", "null"]
        yesBidSize:
          type: ["integer", "null"]
        yesAskSize:
          type: ["integer", "null"]
        rainProbabilityPct:
          type: ["number", "null"]
        settlementStationId:
          type: ["string", "null"]
          description: ICAO id of the exact settlement station, e.g. "KORD". Null if unresolved.
        settlementStationName:
          type: ["string", "null"]
          description: Human-readable settlement station name, e.g. "Chicago O'Hare Intl".
        stationConfidence:
          type: string
          enum: [verified, low_confidence]
          description: Set to verified once the station registry has confirmed the exact station.
      required:
        - ticker
        - cityCode
        - cityName
        - contractDate
        - yesBidCents
        - yesAskCents
        - yesBidSize
        - yesAskSize
        - rainProbabilityPct
        - settlementStationId
        - settlementStationName
        - stationConfidence

    RainMarketsResponse:
      type: object
      properties:
        contractDate:
          type: ["string", "null"]
        markets:
          type: array
          items:
            $ref: "#/components/schemas/RainMarket"
        fetchedAt:
          type: string
        feedFresh:
          type: boolean
        feedStatus:
          type: string
          enum: [live, stale, rate_limited, network_error, no_current_contracts, unavailable]
        kalshiAgeSeconds:
          type: ["integer", "null"]
        probabilitySource:
          type: string
        settlementSource:
          type: string
      required:
        - contractDate
        - markets
        - fetchedAt
        - feedFresh
        - feedStatus
        - kalshiAgeSeconds
        - probabilitySource
        - settlementSource

    SettlementWindow:
      type: object
      description: Settlement window in both LST and local wall-clock time
      properties:
        lstStart:
          type: string
          description: "Settlement window start in LST e.g. '00:00'"
        lstEnd:
          type: string
          description: "Settlement window end in LST e.g. '23:59'"
        localStart:
          type: string
          description: "Wall-clock equivalent start e.g. '01:00'"
        localEnd:
          type: string
          description: "Wall-clock equivalent end e.g. '00:59+1'"
        dstActive:
          type: boolean
          description: Whether DST is currently active for this station
        spillsToNextDay:
          type: boolean
          description: Whether DST causes the window to spill into the next calendar day
        spillsToDate:
          type: ["string", "null"]
          description: The next calendar day date if spilling, else null
        hoursRemaining:
          type: number
          description: Hours remaining until settlement window closes (LST)
        contractDate:
          type: string
          description: "The contract date string e.g. '24 Jul'"
        utcOffset:
          type: integer
          description: "UTC offset in hours (LST, always standard time) e.g. -5"
      required:
        - lstStart
        - lstEnd
        - localStart
        - localEnd
        - dstActive
        - spillsToNextDay
        - spillsToDate
        - hoursRemaining
        - contractDate
        - utcOffset

    CalibrationStats:
      type: object
      properties:
        meanBias:
          type: number
          description: "Mean bias in °F vs NWS point forecast e.g. 0.8"
        sigmaCalibrated:
          type: number
          description: "Calibrated sigma (spread correction) in °F"
        rmse:
          type: number
          description: "RMSE of forecast vs CLI actual over 90-day window"
        pairCount:
          type: integer
          description: Number of valid forecast-CLI pairs in the window
        season:
          type: string
          description: "Current season used for calibration e.g. 'summer'"
        dataSource:
          type: string
          description: "Source of calibration data e.g. 'IEM/ACIS 90d rolling'"
        lastUpdated:
          type: string
          description: ISO timestamp of last calibration update
      required:
        - meanBias
        - sigmaCalibrated
        - rmse
        - pairCount
        - season
        - dataSource
        - lastUpdated

    IntradayObs:
      type: object
      description: A single intraday hourly ASOS observation
      properties:
        timeLst:
          type: string
          description: "LST time e.g. '14:00'"
        tempF:
          type: number
          description: Observed temperature in °F
        isRunningHigh:
          type: boolean
          description: Whether this observation is the current running high
      required:
        - timeLst
        - tempF
        - isRunningHigh

    StationSummary:
      type: object
      properties:
        id:
          type: string
          description: "ICAO station ID e.g. 'KNYC'"
        name:
          type: string
          description: "Human-readable name e.g. 'Central Park, NY'"
        runningHighF:
          type: number
          description: Current running high temperature in °F
        bestBracket:
          type: ["string", "null"]
          description: "The bracket with highest absolute divergence e.g. '91-92°'"
        bestEdgePts:
          type: ["number", "null"]
          description: Net edge in probability points (model - implied - fee), signed
        isActionable:
          type: boolean
          description: Whether best edge exceeds the ±5 pt actionable threshold
        settlementWindow:
          $ref: "#/components/schemas/SettlementWindow"
        feedFresh:
          type: boolean
          description: Whether all feeds are within their freshness TTL
        obsTimestampLst:
          type: string
          description: Timestamp of most recent observation (LST label)
      required:
        - id
        - name
        - runningHighF
        - bestBracket
        - bestEdgePts
        - isActionable
        - settlementWindow
        - feedFresh
        - obsTimestampLst

    StationDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lat:
          type: number
        lon:
          type: number
        runningHighF:
          type: number
        nbmMedianF:
          type: number
          description: Raw NBM point forecast median in °F
        calibratedMedianF:
          type: number
          description: Bias-corrected median in °F
        settlementWindow:
          $ref: "#/components/schemas/SettlementWindow"
        calibration:
          $ref: "#/components/schemas/CalibrationStats"
        intradayObs:
          type: array
          items:
            $ref: "#/components/schemas/IntradayObs"
        feedFresh:
          type: boolean
        feedStatus:
          $ref: "#/components/schemas/FeedStatus"
      required:
        - id
        - name
        - lat
        - lon
        - runningHighF
        - nbmMedianF
        - calibratedMedianF
        - settlementWindow
        - calibration
        - intradayObs
        - feedFresh
        - feedStatus

    FeedStatus:
      type: object
      description: Freshness status of each data feed
      properties:
        nwsObsAgeSeconds:
          type: integer
        nbmAgeSeconds:
          type: integer
        kalshiBookAgeSeconds:
          type: integer
        calibrationAgeSeconds:
          type: integer
        nwsFresh:
          type: boolean
        nbmFresh:
          type: boolean
        kalshiFresh:
          type: boolean
        calibrationFresh:
          type: boolean
      required:
        - nwsObsAgeSeconds
        - nbmAgeSeconds
        - kalshiBookAgeSeconds
        - calibrationAgeSeconds
        - nwsFresh
        - nbmFresh
        - kalshiFresh
        - calibrationFresh

    BracketProbability:
      type: object
      description: Model vs implied probability for a single temperature bracket
      properties:
        label:
          type: string
          description: "Display label e.g. '91–92°'"
        lowerBoundF:
          type: ["number", "null"]
          description: Lower bound in °F (null for open bracket like ≤86°)
        upperBoundF:
          type: ["number", "null"]
          description: Upper bound in °F (null for open bracket like ≥97°)
        modelPct:
          type: integer
          description: Model probability 0-100
        impliedPct:
          type: ["integer", "null"]
          description: Kalshi implied probability 0-100 (mid-price * 100). Null when the book is not quotable (one-sided or spread > 20¢).
        edgePts:
          type: ["number", "null"]
          description: "Net edge: model - implied - fee. Null when impliedPct is null."
        lockStatus:
          type: string
          enum: [live, dead, ambiguous]
          description: live=still possible, dead=running high eliminates it, ambiguous=near METAR rounding boundary
        bidCents:
          type: ["integer", "null"]
        askCents:
          type: ["integer", "null"]
        contractId:
          type: ["string", "null"]
          description: Kalshi contract ticker if mapped
      required:
        - label
        - lowerBoundF
        - upperBoundF
        - modelPct
        - impliedPct
        - edgePts
        - lockStatus
        - bidCents
        - askCents
        - contractId

    NbmSpread:
      type: object
      description: NBM-derived temperature percentile spread for today's forecast high
      properties:
        p10F:
          type: number
          description: 10th percentile temperature in °F
        p25F:
          type: number
          description: 25th percentile temperature in °F
        p50F:
          type: number
          description: 50th percentile (median) temperature in °F
        p75F:
          type: number
          description: 75th percentile temperature in °F
        p90F:
          type: number
          description: 90th percentile temperature in °F
        source:
          type: string
          enum: [nbm, normal_approx]
          description: "'nbm' = real NBM quantile fields; 'normal_approx' = derived from RMSE"
      required:
        - p10F
        - p25F
        - p50F
        - p75F
        - p90F
        - source

    StationDistribution:
      type: object
      properties:
        stationId:
          type: string
        brackets:
          type: array
          items:
            $ref: "#/components/schemas/BracketProbability"
        nbmMedianF:
          type: number
        calibratedMedianF:
          type: number
        biasAppliedF:
          type: number
        bestDivergencePts:
          type: number
        runningHighF:
          type: number
        nbmSpread:
          $ref: "#/components/schemas/NbmSpread"
          description: Raw (pre-bias) NBM percentile spread used to fit the distribution
        bookSnapshotTimeLst:
          type: string
        feedFresh:
          type: boolean
        feedStatus:
          $ref: "#/components/schemas/FeedStatus"
      required:
        - stationId
        - brackets
        - nbmMedianF
        - calibratedMedianF
        - biasAppliedF
        - bestDivergencePts
        - runningHighF
        - nbmSpread
        - bookSnapshotTimeLst
        - feedFresh
        - feedStatus

    MarketRow:
      type: object
      properties:
        contractId:
          type: string
          description: "Kalshi contract ticker e.g. 'KXHIGHNY'"
        stationId:
          type: string
        bracket:
          type: string
          description: "e.g. '91–92°'"
        modelPct:
          type: integer
        impliedPct:
          type: ["integer", "null"]
          description: Null when the book is not quotable (one-sided or spread > 20¢).
        bidCents:
          type: ["integer", "null"]
        askCents:
          type: ["integer", "null"]
        edgeNetPts:
          type: ["number", "null"]
          description: model - implied - fee, signed. Null when impliedPct is null.
        status:
          type: string
          enum: [actionable, settled_short, below_threshold, locked, no_data]
        lockStatus:
          type: string
          enum: [live, dead, ambiguous]
      required:
        - contractId
        - stationId
        - bracket
        - modelPct
        - impliedPct
        - bidCents
        - askCents
        - edgeNetPts
        - status
        - lockStatus

    FeedStatusDetail:
      type: string
      enum: [live, no_api_key, key_lacks_access, unavailable]
      description: >
        Why the feed is stale (or live).
        `no_api_key` — KALSHI_API_KEY not set;
        `key_lacks_access` — key set but weather markets returned no data;
        `unavailable` — other fetch failure;
        `live` — data is current.

    MarketList:
      type: object
      properties:
        markets:
          type: array
          items:
            $ref: "#/components/schemas/MarketRow"
        bookSnapshotTimeLst:
          type: string
        bookLatencySeconds:
          type: integer
        feedFresh:
          type: boolean
        feedStatusDetail:
          $ref: "#/components/schemas/FeedStatusDetail"
      required:
        - markets
        - bookSnapshotTimeLst
        - bookLatencySeconds
        - feedFresh
        - feedStatusDetail

    OrderBookLevel:
      type: object
      properties:
        priceCents:
          type: integer
        size:
          type: integer
        side:
          type: string
          enum: [ask, bid]
        isBest:
          type: boolean
      required:
        - priceCents
        - size
        - side
        - isBest

    ModelDisagreementBreakdown:
      type: object
      description: Step-by-step explanation of why the model diverges from the market
      properties:
        rawNbmMedianF:
          type: number
        biasLabel:
          type: string
          description: "e.g. 'KNYC summer bias correction'"
        biasAppliedF:
          type: number
        calibratedMedianF:
          type: number
        bracketMassPct:
          type: integer
          description: Probability mass in this bracket from the calibrated CDF
        runningHighFloorNote:
          type: ["string", "null"]
          description: "e.g. '≥ 61% conditional (92°F touched)' or null if no floor"
        lockinAmbiguityNote:
          type: ["string", "null"]
          description: "METAR rounding caveat if bracket is near boundary"
      required:
        - rawNbmMedianF
        - biasLabel
        - biasAppliedF
        - calibratedMedianF
        - bracketMassPct
        - runningHighFloorNote
        - lockinAmbiguityNote

    MarketDetail:
      type: object
      properties:
        contractId:
          type: string
        stationId:
          type: string
        stationName:
          type: string
        contractDate:
          type: string
        bracket:
          type: string
        modelPct:
          type: integer
        askCents:
          type: ["integer", "null"]
        edgeNetPts:
          type: ["number", "null"]
          description: Null when the book is not quotable.
        status:
          type: string
          enum: [actionable, settled_short, below_threshold, locked, no_data]
        disagreementBreakdown:
          $ref: "#/components/schemas/ModelDisagreementBreakdown"
        orderBook:
          type: array
          items:
            $ref: "#/components/schemas/OrderBookLevel"
        allBrackets:
          type: array
          items:
            $ref: "#/components/schemas/BracketProbability"
        kalshiUrl:
          type: ["string", "null"]
          description: Direct link to this contract on Kalshi
        orderBookIsLive:
          type: boolean
          description: True when the order book was fetched live from Kalshi (not a stub)
        bookSnapshotTimeLst:
          type: string
        feedFresh:
          type: boolean
        feedStatusDetail:
          $ref: "#/components/schemas/FeedStatusDetail"
      required:
        - contractId
        - stationId
        - stationName
        - contractDate
        - bracket
        - modelPct
        - askCents
        - edgeNetPts
        - status
        - disagreementBreakdown
        - orderBook
        - orderBookIsLive
        - allBrackets
        - kalshiUrl
        - bookSnapshotTimeLst
        - feedFresh
        - feedStatusDetail
