{
  "openapi": "3.1.0",
  "info": {
    "title": "Api",
    "version": "1.0.0",
    "description": "Notara private fundraising CRM"
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "paths": {
    "/crm/session": {
      "get": {
        "operationId": "getCrmPinSession",
        "summary": "Check browser PIN session",
        "security": [],
        "responses": {
          "200": {
            "description": "Session status",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CrmPinSessionStatus"}}}
          }
        }
      },
      "post": {
        "operationId": "loginCrmPin",
        "summary": "Sign in with the server-side PIN",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CrmPinInput"}}}
        },
        "responses": {
          "200": {
            "description": "Persistent HttpOnly session cookie set",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CrmPinSessionStatus"}}}
          },
          "401": {"description": "Incorrect PIN"},
          "403": {"description": "Same-origin request required"},
          "429": {"description": "Too many PIN attempts"},
          "503": {"description": "PIN login is not configured"}
        }
      },
      "delete": {
        "operationId": "logoutCrmPin",
        "summary": "Clear this browser's PIN session",
        "security": [],
        "responses": {
          "200": {
            "description": "Signed out",
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CrmPinSessionStatus"}}}
          },
          "403": {"description": "Same-origin request required"}
        }
      }
    },
    "/healthz": {
      "get": {
        "description": "Returns server health status",
        "operationId": "healthCheck",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthStatus"
                }
              }
            },
            "description": "Healthy"
          }
        },
        "summary": "Health check",
        "tags": [
          "health"
        ]
      }
    },
    "/auth/user": {
      "get": {
        "operationId": "getCurrentAuthUser",
        "parameters": [
          {
            "$ref": "#/components/parameters/AuthorizationSessionHeader"
          },
          {
            "$ref": "#/components/parameters/SessionCookie"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthUserEnvelope"
                }
              }
            },
            "description": "Auth status resolved successfully."
          }
        },
        "summary": "Get the currently authenticated user",
        "tags": [
          "Auth"
        ]
      }
    },
    "/callback": {
      "get": {
        "operationId": "handleBrowserLoginCallback",
        "parameters": [
          {
            "in": "query",
            "name": "code",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "state",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "iss",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure."
          }
        },
        "summary": "Complete the browser OIDC login flow",
        "tags": [
          "Auth"
        ]
      }
    },
    "/login": {
      "get": {
        "operationId": "beginBrowserLogin",
        "parameters": [
          {
            "description": "Relative path to redirect to after login (must start with `/`). Defaults to `/`.",
            "in": "query",
            "name": "returnTo",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to the OIDC authorization endpoint."
          }
        },
        "summary": "Start the browser OIDC login flow",
        "tags": [
          "Auth"
        ]
      }
    },
    "/logout": {
      "get": {
        "operationId": "logoutBrowserSession",
        "parameters": [
          {
            "$ref": "#/components/parameters/AuthorizationSessionHeader"
          },
          {
            "$ref": "#/components/parameters/SessionCookie"
          },
          {
            "in": "query",
            "name": "returnTo",
            "required": false,
            "schema": {
              "default": "/",
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path."
          }
        },
        "summary": "Clear the session and begin OIDC logout",
        "tags": [
          "Auth"
        ]
      }
    },
    "/mobile-auth/logout": {
      "post": {
        "operationId": "logoutMobileSession",
        "parameters": [
          {
            "$ref": "#/components/parameters/AuthorizationSessionHeader"
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LogoutSuccess"
                }
              }
            },
            "description": "Logout processed."
          }
        },
        "summary": "Delete a mobile session token",
        "tags": [
          "Auth"
        ]
      }
    },
    "/mobile-auth/token-exchange": {
      "post": {
        "operationId": "exchangeMobileAuthorizationCode",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MobileTokenExchangeRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileTokenExchangeSuccess"
                }
              }
            },
            "description": "Session created successfully."
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Missing or invalid required fields."
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Token did not contain usable claims."
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Token exchange failed."
          }
        },
        "summary": "Exchange a mobile OIDC code for a session token",
        "tags": [
          "Auth"
        ]
      }
    },
