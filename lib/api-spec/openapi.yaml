  "components": {
    "schemas": {
      "CrmValidationError": {
        "type": "object",
        "required": ["error"],
        "properties": {
          "error": {"type": "string"},
          "row": {"type": "integer", "description": "CSV record number including the header as row 1"},
          "field": {"type": "string"},
          "value": {},
          "reason": {"type": "string"}
        }
      },
      "CrmPinInput": {
        "type": "object",
        "required": ["pin"],
        "properties": {"pin": {"type": "string", "minLength": 1, "maxLength": 128}}
      },
      "CrmPinSessionStatus": {
        "type": "object",
        "required": ["signed_in", "configured"],
        "properties": {"signed_in": {"type": "boolean"}, "configured": {"type": "boolean"}}
      },
      "HealthStatus": {
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ],
        "type": "object"
      },
      "AuthUser": {
        "properties": {
          "email": {
            "type": [
              "string",
              "null"
            ]
          },
          "firstName": {
            "type": [
              "string",
              "null"
            ]
          },
          "id": {
            "type": "string"
          },
          "lastName": {
            "type": [
              "string",
              "null"
            ]
          },
          "profileImageUrl": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "id",
          "email",
          "firstName",
          "lastName",
          "profileImageUrl"
        ],
        "type": "object"
      },
      "AuthUserEnvelope": {
        "properties": {
          "user": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/AuthUser"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "user"
        ],
        "type": "object"
      },
      "ErrorEnvelope": {
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ],
        "type": "object"
      },
      "LogoutSuccess": {
        "properties": {
          "success": {
            "const": true,
            "type": "boolean"
          }
        },
        "required": [
          "success"
        ],
        "type": "object"
      },
      "MobileTokenExchangeRequest": {
        "properties": {
          "code": {
            "minLength": 1,
            "type": "string"
          },
          "code_verifier": {
            "minLength": 1,
            "type": "string"
          },
          "nonce": {
            "minLength": 1,
            "type": "string"
          },
          "redirect_uri": {
            "minLength": 1,
            "type": "string"
          },
          "state": {
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "code",
          "code_verifier",
          "redirect_uri",
          "state"
        ],
        "type": "object"
      },
      "MobileTokenExchangeSuccess": {
        "properties": {
          "token": {
            "type": "string"
          }
        },
        "required": [
          "token"
        ],
        "type": "object"
      },
      "InvestorInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string"
          },
          "firm": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "linkedin_url": {
            "type": "string"
          },
          "website": {
            "type": "string"
          },
          "location": {
            "type": "string"
          },
          "typical_check_size": {
            "type": "string"
          },
          "stage_focus": {
            "type": "string"
          },
          "thesis_notes": {
            "type": "string"
          },
          "warm_intro_path": {
            "type": "string"
          },
          "source_url": {
            "type": "string"
          },
          "pitch_subject": {
            "type": "string"
          },
          "pitch_body": {
