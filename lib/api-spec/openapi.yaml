                }
              }
            }
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Owner only"
          }
        },
        "security": [{"CrmPinSession": []}],
        "parameters": [
          {
            "name": "expert_field",
            "in": "query",
            "required": false,
            "description": "Restrict summary metrics to this field; records without a field count as Dentistry. Omit for all experts.",
            "schema": {
              "type": "string",
              "enum": [
                "Dentistry",
                "Economics",
                "Law Firms",
                "Chinese Law",
                "Indian Law"
              ]
            }
          }
        ]
      }
    },
